# Azure Portal Deployment Center가 생성하는 파일명과 동일하게 유지합니다.
# App Service에서 Oryx로 다시 npm install/build 하지 않고, CI에서 만든 standalone만 배포합니다.
name: Build and deploy Node.js app to Azure Web App - health-care-program

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  AZURE_WEBAPP_NAME: health-care-program

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Package standalone for Azure
        run: |
          test -f .next/standalone/server.js
          printf '[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT=false\n' > .next/standalone/.deployment
          cd .next/standalone
          zip -r ../../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    # GitHub Environment를 쓰면 OIDC subject가 environment:Production 으로 바뀌고,
    # Azure Portal이 등록한 federated identity(ref:refs/heads/main)와 맞지 않아 로그인이 실패한다.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A58952C5E0294554BC598632201E412B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E5861F0922D40CDA20204A3ED82265A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F5973AFBAA454C47A894C22BA8791F8A }}

      - name: Disable App Service remote Oryx build
        continue-on-error: true
        run: |
          RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup" -o tsv | head -n 1)
          if [ -z "$RG" ]; then
            echo "Resource group not resolved; ZIP .deployment will disable Oryx."
            exit 0
          fi
          echo "Resource group: $RG"
          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "$RG" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              HOSTNAME=0.0.0.0 \
            --output none
          az webapp config set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "$RG" \
            --startup-file "node server.js" \
            --output none

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: release.zip
